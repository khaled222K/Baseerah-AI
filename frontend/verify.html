<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تحققي من دليل | بصيرة Baseerah AI</title>
  <meta name="description" content="بصيرة: إجابةٌ تستند إلى أصل. محتوى شرعي قابل للتتبع إلى مصدره.">
  <meta name="theme-color" content="#FFF8F5">
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/verify.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">تخطَّي إلى المحتوى</a>
  <div class="app">
    <div class="main-col">
      <main id="main" class="page page-band" tabindex="-1">
        <div class="container">
          <header class="page-head">
            <h1><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 4.5H8a4 4 0 0 1 4 4V21a3 3 0 0 0-3-3H2.5Z"/><path d="M21.5 4.5H16a4 4 0 0 0-4 4V21a3 3 0 0 1 3-3h6.5Z"/></svg>تحققي من دليل</h1>
            <p>أدخلي آية أو حديثًا أو نصًا متداولًا للتحقق من صحته ومصدره.</p>
          </header>
          <form class="card card-pad verify-form" id="verify-form">
            <label class="sr-only" for="verify-text">النص المراد التحقق منه</label>
            <textarea id="verify-text" maxlength="500" placeholder="الصقي هنا نص الآية أو الحديث أو العبارة المتداولة..." aria-describedby="verify-count verify-help"></textarea>
            <div class="row">
              <span class="char-count" id="verify-count" aria-live="polite">0/500</span>
              <button class="btn btn-primary" id="verify-btn" type="submit" disabled>
                <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14Z"/><path d="m20.5 20.5-4.3-4.3"/></svg>
                تحققي من الدليل
              </button>
            </div>
            <p class="composer-hint" id="verify-help">يُقارن النص بالنصوص المخزنة في مصادر بصيرة مقارنةً لفظية، ولا يولّد الذكاء الاصطناعي أي نص.</p>
          </form>
          <section class="verify-result" id="verify-result" aria-live="polite"></section>
        </div>
      </main>
    </div>
  </div>
  <noscript><p style="padding:24px;text-align:center">تحتاج بصيرة إلى تفعيل JavaScript في المتصفح.</p></noscript>
</body>
</html>

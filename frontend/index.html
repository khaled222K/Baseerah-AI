<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>بصيرة | Baseerah AI — اسألي بصيرة</title>
  <meta name="description" content="بصيرة: إجابةٌ تستند إلى أصل. محتوى شرعي قابل للتتبع إلى مصدره.">
  <meta name="theme-color" content="#FFF8F5">
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/config.js"></script>
  <script type="module" src="js/chat.js"></script>
</head>
<body>
  <a class="skip-link" href="#question">انتقلي إلى خانة السؤال</a>
  <div class="app">
    <div class="main-col">
      <main id="main" class="page page-ask">
        <section class="hero" id="hero" aria-labelledby="hero-title">
          <div class="hero-arches" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="hero-shade" aria-hidden="true"></div>
          <div class="hero-inner">
            <div class="logo logo-lg" aria-hidden="true">
              <img src="assets/logo/mark.svg" alt="" width="84" height="84">
              <span class="logo-text"><span class="logo-ar">بصيرة</span><span class="logo-en">Baseerah AI</span></span>
            </div>
            <h1 id="hero-title">إجابةٌ تستند إلى أصل.</h1>
            <p class="subtitle">محتوى شرعي قابل للتتبع إلى مصدره.</p>
            <div id="hero-composer-slot">
              <form class="composer" id="composer" role="search" aria-label="اسألي بصيرة">
                <label class="sr-only" for="question">سؤالك</label>
                <textarea id="question" name="question" rows="1" maxlength="1000" placeholder="اكتبي سؤالك هنا..." autocomplete="off" enterkeyhint="send"></textarea>
                <span class="char-count" id="char-count" hidden aria-live="polite"></span>
                <button class="send-btn" id="send" type="submit" aria-label="إرسال السؤال" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 2.5 10.5 13.5"/><path d="M21.5 2.5 15 21.5l-4.5-8-8-4.5Z"/></svg>
                </button>
              </form>
            </div>
            <div class="suggestions">
              <p class="suggestions-title">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/></svg>
                أو جرّبي أحد هذه الأسئلة:
              </p>
              <ul class="suggestion-list" id="suggestion-list"></ul>
            </div>
          </div>
        </section>
        <section class="chat" id="chat" hidden aria-label="المحادثة">
          <div class="thread" id="thread"></div>
          <div class="chat-composer-wrap">
            <div id="chat-composer-slot"></div>
            <p class="composer-hint">اضغطي Enter للإرسال وShift+Enter لسطر جديد.</p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <noscript><p style="padding:24px;text-align:center">تحتاج بصيرة إلى تفعيل JavaScript في المتصفح.</p></noscript>
</body>
</html>
